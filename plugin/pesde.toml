name = "verde/plugin"
version = "0.1.0"
description = "The verde roblox plugin."
license = "MPL-2.0"
authors = ["quantix-dev"]
repository = "https://github.com/verde-rbx/verde"
private = false

[target]
environment = "roblox"

[indices]
default = "https://github.com/daimond113/pesde-index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[dependencies]
vide = { wally = "centau/vide", version = "^0.1.1", index = "default" }
